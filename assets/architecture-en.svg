<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0EA5E9"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F6"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#C7DDFB"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 9 7; animation: dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      .glow { animation: glow 2.6s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="640" rx="18" fill="url(#bg)" stroke="#E2E8F0"/>

  <!-- 列1：输入 -->
  <rect x="40" y="70" width="190" height="230" rx="14" fill="#FFFFFF" stroke="#E6EAF0" filter="url(#soft)"/>
  <text x="60" y="100" fill="#1D4ED8" font-size="18" font-weight="700">Input</text>
  <rect x="58" y="126" width="154" height="56" rx="12" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="135" y="161" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="600">E-stop</text>
  <rect x="58" y="214" width="154" height="56" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="135" y="240" text-anchor="middle" fill="#1E3A8A" font-size="17" font-weight="600">XR mocap</text><text x="135" y="262" text-anchor="middle" fill="#1E3A8A" font-size="17" font-weight="600">· Gamepad</text>

  <!-- 列1：感知 -->
  <rect x="40" y="340" width="190" height="250" rx="14" fill="#FFFFFF" stroke="#E6EAF0" filter="url(#soft)"/>
  <text x="60" y="370" fill="#1D4ED8" font-size="18" font-weight="700">Perception</text>
  <rect x="58" y="416" width="154" height="128" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="135" y="470" text-anchor="middle" fill="#1E3A8A" font-size="17" font-weight="600">IMU</text>
  <text x="135" y="500" text-anchor="middle" fill="#1E3A8A" font-size="17" font-weight="600">Camera · LiDAR</text>

  <!-- 列2：运控基座 -->
  <rect x="260" y="70" width="360" height="520" rx="14" fill="#FFFFFF" stroke="#E6EAF0" filter="url(#soft)"/>
  <text x="280" y="100" fill="#1D4ED8" font-size="18" font-weight="700">Motion Control Base</text>
  <rect x="284" y="150" width="312" height="96" rx="12" fill="url(#aiGrad)" stroke="#60A5FA"/>
  <text x="440" y="188" text-anchor="middle" fill="#1E3A8A" font-size="18" font-weight="600">Motion retargeting</text>
  <text x="440" y="214" text-anchor="middle" fill="#2563EB" font-size="14">GMR · SOMA · HHTools</text>
  <rect x="284" y="390" width="312" height="96" rx="12" fill="url(#aiGrad)" stroke="#60A5FA"/>
  <text x="440" y="424" text-anchor="middle" fill="#1E3A8A" font-size="18" font-weight="600">Motion policies</text>
  <text x="440" y="448" text-anchor="middle" fill="#2563EB" font-size="13">BeyondMimic · MimicLite · UFO</text>
  <text x="440" y="470" text-anchor="middle" fill="#2563EB" font-size="13">IBFM · PBFM</text>

  <!-- 列3：实时控制 -->
  <rect x="650" y="70" width="300" height="520" rx="14" fill="#FFFFFF" stroke="#E6EAF0" filter="url(#soft)"/>
  <text x="670" y="100" fill="#0284C7" font-size="18" font-weight="700">Real-time Control</text>
  <rect x="674" y="150" width="252" height="96" rx="12" fill="#E0F2FE" stroke="#38BDF8" class="glow"/>
  <text x="800" y="178" text-anchor="middle" fill="#075985" font-size="18" font-weight="600">Action decoding</text><text x="800" y="200" text-anchor="middle" fill="#075985" font-size="18" font-weight="600">Serial-link solving</text>
  <text x="795" y="226" text-anchor="middle" fill="#0284C7" font-size="14">Control 500 Hz</text>
  <rect x="674" y="390" width="252" height="96" rx="12" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="800" y="420" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="600">Whole-body execution</text>
  <text x="800" y="445" text-anchor="middle" fill="#475569" font-size="14">ROMOMO joint modules</text>
  <text x="800" y="467" text-anchor="middle" fill="#475569" font-size="14">RP-hand</text>

  <!-- Arrows -->
  <line class="flow" x1="230" y1="242" x2="284" y2="198" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="flow" x1="230" y1="480" x2="284" y2="438" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="flow" x1="440" y1="246" x2="440" y2="386" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="flow" x1="596" y1="438" x2="674" y2="198" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="flow" x1="800" y1="246" x2="800" y2="386" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" d="M230,154 C380,108 520,108 646,142" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feedback -> 运动策略 -->
  <line class="flow" x1="674" y1="438" x2="600" y2="438" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrowC)"/>
  <text x="637" y="428" text-anchor="middle" fill="#0284C7" font-size="14">Feedback</text>
</svg>
